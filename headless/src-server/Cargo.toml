[package]
name = "bridgething-headless"
default-run = "bridgething-headless"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
description = "the bridgething companion host without a desktop: a daemon plus the console over http"

[lib]
name = "bridgething_headless"
path = "src/lib.rs"

[[bin]]
name = "bridgething-headless"
path = "src/main.rs"

[features]
default = []
# whisper transcription and the onnx intent runner; heavy on a pi, off unless asked for
voice = ["bridgething-host-shell/voice"]
# geoclue, freedesktop notifications, and speech-dispatcher, for a pi that runs a session
desktop-session = ["bridgething-host-shell/desktop-session"]

[dependencies]
bridgething-host-shell = { path = "../../crates/host-shell", default-features = false }

axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = { workspace = true }
mdns-sd = "0.20.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"
