[package]
name = "bridgething-desktop"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
name = "bridgething_desktop"
path = "src/lib.rs"

[[bin]]
name = "bridgething-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
mdns-sd = "0.20.3"
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["test"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { workspace = true, features = ["v7"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dependencies]
bridgething-companion = { path = "../../crates/companion", features = ["native-io"] }
bridgething-delivery = { path = "../../crates/delivery/core" }
bridgething-host-shell = { path = "../../crates/host-shell" }
libbridgething = { path = "../../crates/lib" }
libc = "0.2.189"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
thiserror.workspace = true
tracing.workspace = true
